<svg class="ban" width="1500" height="400" viewBox="0 0 1500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .panel { fill: #07090c; }
    .grid { stroke: #1b3d2c; stroke-width: 1; opacity: 0.45; }
    .scan { fill: url(#scanGrad); opacity: 0.18; }
    .edge { fill: none; stroke: url(#edgeGrad); stroke-width: 2.2; }
    .glow-ring { fill: none; stroke: #3dff8a; stroke-width: 10; opacity: 0.18; filter: url(#soft); }
    .hud { stroke: #3dff8a; fill: none; stroke-width: 2; }
    .gem-stroke { stroke: #d7ffe8; fill: none; stroke-width: 13; stroke-linejoin: round; stroke-linecap: round; filter: url(#neon); }
    .gem-bar { stroke: #d7ffe8; stroke-width: 13; stroke-linecap: round; filter: url(#neon); }
    .spin { transform-box: fill-box; transform-origin: center; stroke: #3dff8a; stroke-width: 11; }
    .spin-rev { transform-box: fill-box; transform-origin: center; stroke: #00e5ff; stroke-width: 11; transform: scaleY(-1); }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .glitch { opacity: 0; mix-blend-mode: screen; }
    @media (prefers-reduced-motion: no-preference) {
      .spin { animation: spin 18s linear infinite; }
      .spin-rev { animation: spin-rev 22s linear infinite; }
      .scan { animation: sweep 3.6s linear infinite; }
      .edge { stroke-dasharray: 18 10; animation: dash 8s linear infinite; }
      .glitch-c { animation: glitchC 4.5s steps(2, end) infinite; }
      .glitch-m { animation: glitchM 4.5s steps(2, end) infinite; }
      .name { animation: flicker 6s steps(2, end) infinite; }
      .cursor { animation: blink 1.1s steps(1, end) infinite; }
    }
    @keyframes spin { to { rotate: -360deg; } }
    @keyframes spin-rev { to { rotate: 360deg; } }
    @keyframes sweep { from { transform: translateY(-220px); } to { transform: translateY(420px); } }
    @keyframes dash { to { stroke-dashoffset: -280; } }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes flicker { 0%,92%,100% { opacity: 1; } 93% { opacity: 0.35; } 94% { opacity: 1; } 96% { opacity: 0.2; } 97% { opacity: 1; } }
    @keyframes glitchC { 0%,88%,100% { opacity: 0; transform: translate(0,0); } 89% { opacity: 0.85; transform: translate(7px,-3px); } 90% { opacity: 0.4; transform: translate(-6px,2px); } 91% { opacity: 0; } }
    @keyframes glitchM { 0%,88%,100% { opacity: 0; transform: translate(0,0); } 89% { opacity: 0.8; transform: translate(-8px,3px); } 90% { opacity: 0.35; transform: translate(5px,-2px); } 91% { opacity: 0; } }
  </style>
  <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00e5ff"/>
    <stop offset="50%" stop-color="#3dff8a"/>
    <stop offset="100%" stop-color="#00e5ff"/>
  </linearGradient>
  <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3dff8a" stop-opacity="0"/>
    <stop offset="50%" stop-color="#3dff8a" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#3dff8a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
    <stop offset="20%" stop-color="#000" stop-opacity="0"/>
    <stop offset="80%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
  </linearGradient>
  <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <clipPath id="card">
    <rect x="18" y="18" width="1464" height="364" rx="28"/>
  </clipPath>
</defs>
