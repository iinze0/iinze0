<svg class="gem" width="1500" height="420" viewBox="0 0 1500 420" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .gem { color: hsl(0 0% 16%); }
    .card {
      fill: hsl(0 0% 12% / 0.06);
      stroke: hsl(0 0% 12% / 0.14);
    }
    .sheen {
      fill: url(#sheen);
    }
    @media (prefers-color-scheme: dark) {
      .gem { color: hsl(0 0% 98%); }
      .card {
        fill: hsl(0 0% 100% / 0.07);
        stroke: hsl(0 0% 100% / 0.16);
      }
    }
    .gem__spin {
      transform-box: fill-box;
      transform-origin: center;
    }
    .gem__spin--rev {
      --to: 360deg;
      transform: scaleY(-1);
    }
    @media (prefers-reduced-motion: no-preference) {
      .gem__spin {
        animation: spin 30s infinite linear;
      }
    }
    @keyframes spin {
      to { rotate: var(--to, -360deg); }
    }
  </style>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
    <stop offset="38%" stop-color="#ffffff" stop-opacity="0.03"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="cardClip">
    <rect x="28" y="28" width="1444" height="364" rx="36"/>
  </clipPath>
</defs>
