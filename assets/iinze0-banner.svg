<svg width="1500" height="500" viewBox="0 0 1500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .panel { fill: #07090c; }
    .grid { stroke: #163528; stroke-width: 1; opacity: 0.35; }
    .scan { fill: url(#scanGrad); opacity: 0.22; }
    .edge { fill: none; stroke: url(#edgeGrad); stroke-width: 2; }
    .glow { fill: none; stroke: #3dff8a; stroke-width: 14; opacity: 0.16; filter: url(#soft); }
    .hud { stroke: #3dff8a; fill: none; stroke-width: 1.6; opacity: 0.8; }
    .gem { stroke: #e9fff3; fill: none; stroke-width: 8; stroke-linejoin: round; filter: url(#neon); }
    .facet { stroke: #3dff8a; stroke-width: 7; transform-box: fill-box; transform-origin: center; }
    .facet-b { stroke: #00e5ff; stroke-width: 7; transform-box: fill-box; transform-origin: center; transform: scaleY(-1); }
    .name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 108px; font-weight: 700; letter-spacing: 10px; fill: #f4fff8; }
    .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 24px; letter-spacing: 7px; fill: #7dffb3; }
    .meta { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; letter-spacing: 3px; fill: #4d8f68; }
    @media (prefers-reduced-motion: no-preference) {
      .facet { animation: spin 16s linear infinite; }
      .facet-b { animation: spinrev 20s linear infinite; }
      .scan { animation: sweep 4s linear infinite; }
      .edge { stroke-dasharray: 16 12; animation: dash 9s linear infinite; }
      .glow { animation: pulse 2.8s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
    }
    @keyframes spin { to { rotate: -360deg; } }
    @keyframes spinrev { to { rotate: 360deg; } }
    @keyframes sweep { from { transform: translateY(-240px); } to { transform: translateY(520px); } }
    @keyframes dash { to { stroke-dashoffset: -280; } }
    @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00e5ff"/><stop offset="0.5" stop-color="#3dff8a"/><stop offset="1" stop-color="#00e5ff"/>
  </linearGradient>
  <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3dff8a" stop-opacity="0"/><stop offset="0.5" stop-color="#3dff8a" stop-opacity="0.5"/><stop offset="1" stop-color="#3dff8a" stop-opacity="0"/>
  </linearGradient>
  <filter id="neon" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="card"><rect x="16" y="16" width="1468" height="468" rx="28"/></clipPath>
  <mask id="lower"><path d="M 150 214 H 350 L 250 352 Z" fill="white"/></mask>
  <mask id="upper"><path d="M 186 132 H 314 L 350 214 H 150 Z" fill="white"/></mask>
</defs>
<g clip-path="url(#card)">
  <rect class="panel" x="16" y="16" width="1468" height="468" rx="28"/>
  <path class="grid" d="M40 16 V484 M120 16 V484 M200 16 V484 M280 16 V484 M360 16 V484 M440 16 V484 M520 16 V484 M600 16 V484 M680 16 V484 M760 16 V484 M840 16 V484 M920 16 V484 M1000 16 V484 M1080 16 V484 M1160 16 V484 M1240 16 V484 M1320 16 V484 M1400 16 V484 M16 60 H1484 M16 140 H1484 M16 220 H1484 M16 300 H1484 M16 380 H1484 M16 460 H1484"/>
  <rect class="scan" x="16" y="16" width="1468" height="80"/>
  <path class="hud" d="M48 48 H96 M48 48 V96 M1452 48 H1404 M1452 48 V96 M48 452 H96 M48 452 V404 M1452 452 H1404 M1452 452 V404"/>
  <ellipse class="glow" cx="250" cy="230" rx="108" ry="108"/>
  <g mask="url(#lower)"><path class="facet" d="M70 250 H430 M96 190 L404 310 M140 140 L360 360 M196 108 L304 392 M250 90 V410 M304 108 L196 392 M360 140 L140 360 M404 190 L96 310"/></g>
  <g mask="url(#upper)"><path class="facet-b" d="M70 176 H430 M96 116 L404 236 M140 66 L360 286 M196 34 L304 318 M250 16 V336 M304 34 L196 318 M360 66 L140 286 M404 116 L96 236"/></g>
  <path class="gem" d="M186 132 H314 L350 214 L250 352 L150 214 Z"/>
  <path class="gem" d="M150 214 H350"/>
  <text class="name" x="430" y="236">iinze0</text>
  <rect class="cursor" x="1048" y="156" width="14" height="78" fill="#3dff8a"/>
  <text class="sub" x="434" y="292">WINDOWS  ·  KALI  ·  TOOLS</text>
  <text class="meta" x="436" y="338">FINLAND</text>
</g>
<rect class="edge" x="16" y="16" width="1468" height="468" rx="28"/>
</svg>
